[project]
name = "spidal"
version = "0.1.2"
description = "FLAC downloader with a terminal UI and CLI. Searches the Monochrome API, matches via Spotify ISRC, and tags downloaded files with MusicBrainz metadata."
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "Minh Nguyen", email = "983465+minhio@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "musicbrainzngs>=0.7.1",
    "mutagen>=1.47.0",
    "requests>=2.32.5",
    "textual>=7.5.0",
    "tinydb>=4.8.2",
    "typer>=0.23.1",
]

[project.urls]
Homepage = "https://github.com/minhio/spidal"
Repository = "https://github.com/minhio/spidal"
Issues = "https://github.com/minhio/spidal/issues"

[project.scripts]
spidal = "spidal.cli:app"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: tests that make real network requests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
    "textual-dev>=1.8.0",
]
